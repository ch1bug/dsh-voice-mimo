# dsh-voice-mimo bundle layer — applied when a profile lists this bundle
# (package.json declares `dsh.bundle.patch` pointing at this file).
#
# `name` is a PACKAGE NAME resolved through the profile's node_modules;
# `dsh-voice-mimo` is this package's main entry (→ lib/index.js).
- insert:
    - id: dsh-voice-mimo
      name: dsh-voice-mimo
